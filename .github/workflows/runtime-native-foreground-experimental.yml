name: Experimental native foreground runtime

on:
  workflow_dispatch:
  push:
    branches:
      - codex/**
    paths:
      - .github/workflows/runtime-native-foreground-experimental.yml
      - runtime-build/experimental/native-foreground/**
      - runtime-build/test-sdl-context.py
      - runtime-build/patches/qemu/0013-bound-native-foreground-permission-to-sdl-grant.patch
      - runtime-build/patches/qemu/0014-bind-foreground-handoff-to-launcher.patch

permissions:
  contents: read

jobs:
  build:
    name: Compile isolated native foreground WINQ-EMU
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            bison
            diffutils
            flex
            git
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-dtc
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-yaml
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-zstd

      - name: Build separate experimental archives
        id: build_runtime
        shell: msys2 {0}
        run: bash runtime-build/experimental/native-foreground/build.sh runtime-output-native-foreground-experimental

      - name: Verify compiled QMP command without a display
        shell: msys2 {0}
        run: python runtime-build/experimental/native-foreground/smoke_qmp.py runtime-output-native-foreground-experimental/smoke/qemu-system-x86_64.exe

      - name: Upload isolated source and runtime
        if: ${{ !cancelled() && steps.build_runtime.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winq-emu-native-foreground-v2-experimental
          path: |
            runtime-output-native-foreground-experimental/*.zip
            runtime-output-native-foreground-experimental/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
